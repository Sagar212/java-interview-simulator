        "type": "question",
        "content": "Is Java Pass-by-Reference? Prove why Java is strictly Pass-by-Value."
    },
    {
        "type": "theory",
        "content": "Java is **strictly Pass-by-Value**. It never passes the actual object itself; it passes a *copy of the memory reference* that points to the object. \n\nIf you modify the object's internal fields using that copied reference, the original object changes (which tricks people into thinking it's pass-by-reference). However, if you try to reassign the reference variable entirely to a brand new object using the `new` keyword, the original object in the calling method remains completely untouched. If Java were actually Pass-by-Reference, the original object would have been swapped."
    },
    {
        "type": "code",
        "lang": "java",
        "content": "public class PassByValueDemo {\n    public static void main(String[] args) {\n        Dog myDog = new Dog(\"Max\");\n        modifyDog(myDog);\n        \n        // Output is \"Charlie\", NOT \"Rex\"!\n        System.out.println(myDog.name); \n    }\n\n    public static void modifyDog(Dog dogParam) {\n        // 1. This works because the copied reference points to the same original object in memory.\n        dogParam.name = \"Charlie\"; \n        \n        // 2. TRICKY PART: We reassign the reference to a brand new object.\n        // If Java was Pass-By-Reference, 'myDog' in main would now point to this new \"Rex\" dog.\n        // But because it is Pass-By-Value, this only overwrites the local 'dogParam' copy.\n        dogParam = new Dog(\"Rex\"); \n    }\n}"
    },
    {
        "type": "question",
        "content": "Tricky Scenarios: Interface vs Abstract Class in modern Java (8+)"
    },
    {
        "type": "theory",
        "content": "Since Java 8 introduced `default` and `static` methods in interfaces with concrete bodies, the line between them has blurred. Interviewers will test your knowledge on the strict limitations that remain:\n\n<table>\n    <tr><th>Feature</th><th>Interface</th><th>Abstract Class</th></tr>\n    <tr><td><strong>Constructors</strong></td><td><strong>CANNOT</strong> have constructors. An interface cannot be instantiated, nor does it have state to initialize.</td><td><strong>CAN</strong> have constructors. They are called when a concrete child class is created to initialize shared state.</td></tr>\n    <tr><td><strong>Variables (State)</strong></td><td>All variables are strictly <code>public static final</code> (constants). You cannot declare mutable instance variables.</td><td>Can have standard, mutable instance variables (protected, private) to maintain state across methods.</td></tr>\n    <tr><td><strong>Multiple Inheritance</strong></td><td>A class can <code>implement</code> multiple interfaces.</td><td>A class can only <code>extend</code> a single abstract class.</td></tr>\n    <tr><td><strong>Access Modifiers</strong></td><td>Methods are implicitly <code>public abstract</code>. (Java 9 added <code>private</code> methods for sharing internal logic).</td><td>Methods can be <code>protected</code>, <code>private</code>, or <code>public</code>.</td></tr>\n</table>"
    },
    {
        "type": "question",
        "content": "What is the difference between String and StringBuffer? What will be the output of `str.concat()`?"
    },
    {
        "type": "theory",
        "content": "A `String` in Java is immutable, meaning once an object is created, its value cannot be changed. Any operation that seems to alter the string actually creates a brand new string object in memory. `StringBuffer`, on the other hand, is mutable and thread-safe (its methods are synchronized), allowing you to modify the sequence of characters without creating new objects, which is highly memory-efficient during heavy string manipulation.\n        \n<table>\n    <tr><th>Feature</th><th>String</th><th>StringBuffer</th></tr>\n    <tr><td>Mutability</td><td>Immutable</td><td>Mutable</td></tr>\n    <tr><td>Thread Safety</td><td>Not thread-safe (but immutable, so inherently safe)</td><td>Thread-safe (Synchronized)</td></tr>\n    <tr><td>Performance</td><td>Slow for heavy concatenations (creates many objects)</td><td>Fast for heavy concatenations</td></tr>\n    <tr><td>Storage</td><td>String Pool (if literal) or Heap</td><td>Heap Memory</td></tr>\n</table>\n\nIf you execute `str.concat(\"xyz\")` without assigning it, the original string **remains completely unchanged** because the `concat` method creates and returns a new object. To retain the change, you must assign it: `str = str.concat(\"xyz\");`."
    },
    {
        "type": "question",
        "content": "What happens when comparing String literals with the == operator vs equals()?"
    },
    {
        "type": "theory",
        "content": "In Java, the `==` operator checks for **reference equality**, meaning it verifies whether two variables point to the exact same memory address in the heap. The `equals()` method, which is overridden in the String class, checks for **value equality**, meaning it compares the actual character sequence. \n\nBecause of memory optimization, Java uses a special memory area called the String Pool. **Strings created without the new keyword are cached in the String Pool.** Therefore, if you write `String s1 = \"hello\"; String s2 = \"hello\";`, the JVM only creates one object in the pool and points both references to it, making `s1 == s2` evaluate to true. However, using `new String(\"hello\")` forces Java to allocate a brand new object in standard Heap memory, bypassing the pool, which makes `==` return false."
    },
    {
        "type": "question",
        "content": "What is a final variable, method, and class?"
    },
    {
        "type": "theory",
        "content": "The `final` keyword in Java is an access modifier used to apply strict restrictions on classes, methods, and variables.\n\n1. **Final Variable**: It becomes a constant. Once initialized, its value cannot be reassigned. If it's a reference variable, you cannot reassign it to point to a different object, though the object's internal state can still change.\n2. **Final Method**: A method marked as final **cannot be overridden** by subclasses. This is often used in designing APIs to prevent the alteration of critical algorithms or security mechanisms.\n3. **Final Class**: A class marked as final cannot be extended (inherited from). Examples in the JDK include the `String` and wrapper classes like `Integer`. This prevents inheritance-based vulnerabilities."
    },
    {
        "type": "question",
        "content": "What are wrapper classes and why are they needed?"
    },
    {
        "type": "theory",
        "content": "Wrapper classes (such as `Integer`, `Boolean`, `Double`) provide a way to convert primitive data types into fully-fledged objects. They are primarily needed because **Java's Collections Framework (like ArrayList, HashMap) only works with Objects and cannot store primitives directly**. \n\nAdditionally, wrapper classes provide extremely useful utility methods (e.g., `Integer.parseInt(String)`) and allow the representation of `null` values, which is heavily used in databases to signify the absence of a value (a primitive `int` defaults to 0, not null). Java utilizes Autoboxing and Unboxing to automatically convert between primitives and their respective wrapper classes."
    },
    {
        "type": "question",
        "content": "What is a finally block and why is it needed? What is try-with-resources?"
    },
    {
        "type": "theory",
        "content": "The `finally` block is attached to a try-catch block and contains crucial code that **always executes regardless of whether an exception was thrown or caught**. It is primarily needed to safely release system resources (closing database connections, file streams, sockets) to prevent memory leaks.\n\nJava 7 introduced `try-with-resources`, an elegant syntactical improvement that automates this process. Any resource declared inside the parenthesis of a `try` block that **implements the AutoCloseable interface** will be automatically closed at the end of the statement, completely removing the need for an explicit `finally` block."
    },
    {
        "type": "question",
        "content": "Can a constructor be final or static? What is the difference between a method and a constructor?"
    },
    {
        "type": "theory",
        "content": "Constructors **cannot be final or static**. A constructor belongs to object instantiation, so `static` (class-level) makes no sense. Furthermore, constructors are never inherited by subclasses, so applying `final` (which prevents overriding) is redundant and illegal in Java.\n\n<table>\n    <tr><th>Feature</th><th>Constructor</th><th>Method</th></tr>\n    <tr><td>Purpose</td><td>Initializes the state of a newly created object.</td><td>Defines the behavior or logic of an object.</td></tr>\n    <tr><td>Return Type</td><td>Has no return type (not even void).</td><td>Must have a return type or void.</td></tr>\n    <tr><td>Naming</td><td>Must perfectly match the exact name of the Class.</td><td>Can be named anything (camelCase conventionally).</td></tr>\n    <tr><td>Invocation</td><td>Invoked implicitly via the <code>new</code> keyword.</td><td>Invoked explicitly via object or class references.</td></tr>\n</table>"
    },
    {
        "type": "question",
        "content": "What is the Reflection API?"
    },
    {
        "type": "theory",
        "content": "The Reflection API allows a Java program to **inspect, analyze, and manipulate the internal properties of classes, methods, and fields at runtime**, even if they are declared as private. This means you can invoke private methods or instantiate objects without knowing their class names at compile time.\n\nWhile powerful, it is generally slow and breaks encapsulation. However, it is the backbone of major frameworks like Spring and Hibernate, allowing them to dynamically perform Dependency Injection, mapping, and proxy generation without hardcoded references."
    },
    {
        "type": "question",
        "content": "What is the difference between an Abstract Class and an Interface? Can we create an object of an abstract class?"
    },
    {
        "type": "theory",
        "content": "Both Abstract Classes and Interfaces are mechanisms to achieve abstraction in Java, but they serve different design paradigms.\n\n<table>\n    <tr><th>Feature</th><th>Abstract Class</th><th>Interface</th></tr>\n    <tr><td>Inheritance</td><td>A class can extend only one Abstract Class (no multiple inheritance).</td><td>A class can implement multiple Interfaces.</td></tr>\n    <tr><td>State (Variables)</td><td>Can hold instance variables (state). Fields can be protected, private, etc.</td><td>Cannot hold instance variables. All fields are implicitly <code>public static final</code> (constants).</td></tr>\n    <tr><td>Constructors</td><td>Can have constructors which are invoked during child class instantiation.</td><td>Cannot have constructors.</td></tr>\n    <tr><td>Usage</td><td>Used when objects share a common foundational identity (e.g., Vehicle -> Car).</td><td>Used to define a capability or contract (e.g., Flyable -> Bird, Airplane).</td></tr>\n</table>\n\n**You cannot instantiate an abstract class directly** using the `new` keyword because it is incomplete. However, you can instantiate its concrete subclasses, or create an anonymous inner class on the fly."
    },
    {
        "type": "question",
        "content": "What is a Functional Interface in Java? Give examples of built-in functional interfaces."
    },
    {
        "type": "theory",
        "content": "A Functional Interface is an interface that contains **exactly one abstract method** (SAM - Single Abstract Method). They are the absolute foundation of functional programming in Java because they provide target types for Lambda Expressions and Method References. You can optionally enforce this rule at compile-time using the `@FunctionalInterface` annotation.\n\nEven if an interface has default methods or static methods, as long as it has exactly one abstract method, it remains a functional interface.\n\n<table>\n    <tr><th>Interface</th><th>Abstract Method</th><th>Purpose</th></tr>\n    <tr><td><code>Predicate&lt;T&gt;</code></td><td><code>boolean test(T t)</code></td><td>Evaluates a boolean condition (e.g., used inside Stream <code>filter()</code>).</td></tr>\n    <tr><td><code>Function&lt;T, R&gt;</code></td><td><code>R apply(T t)</code></td><td>Transforms an input <code>T</code> into an output <code>R</code> (e.g., used inside Stream <code>map()</code>).</td></tr>\n    <tr><td><code>Consumer&lt;T&gt;</code></td><td><code>void accept(T t)</code></td><td>Consumes an input but returns nothing (e.g., used in <code>forEach()</code>).</td></tr>\n    <tr><td><code>Supplier&lt;T&gt;</code></td><td><code>T get()</code></td><td>Takes no arguments but supplies a result (e.g., lazy generation).</td></tr>\n</table>"
    },

        "type": "theory",

    },

        "type": "question",

    },
    {
        "type": "theory",
        "content": "To prevent a MITM from modifying API request bodies, you implement HMAC (Hash-based Message Authentication Code). The client calculates a cryptographic hash of the JSON payload using a shared Secret Key and sends it in the `X-Signature` header. \n\nThe server receives the payload, re-hashes it using the identical Secret Key, and compares it to the client's header. **If the hashes don't match, the request was tampered with in transit**, and the server rejects it with a 401 Unauthorized."
    },

    },

    },

        "content": "How does HashMap work internally in Java? What is the difference between HashMap and ConcurrentHashMap?"
    },
    {
        "type": "theory",
        "content": "<p><strong>Step 1: Hashing & Indexing</strong></p>\n<p>When you call <code>put(Key, Value)</code>, HashMap calculates the hash code of the Key using its <code>hashCode()</code> method. It then applies a secondary bitwise hash function (<code>(n - 1) & hash</code>) to determine the exact <strong>Bucket Index</strong> (the specific slot in its internal array) where the data should go.</p>\n\n<p><strong>Step 2: Collision Handling</strong></p>\n<p>If two different keys produce the exact same bucket index, a <strong>Collision</strong> occurs. Before Java 8, the HashMap simply stored these colliding entries in a standard <strong>LinkedList</strong> hanging off that specific bucket. However, if a massive amount of collisions occurred, searching that bucket degraded from an optimal O(1) to a terrible O(n) performance.</p>\n\n<p><strong>Step 3: Java 8 Red-Black Tree Optimization</strong></p>\n<p>To fix the O(n) worst-case performance, Java 8 introduced a massive architectural optimization: If the number of nodes in a single bucket's LinkedList crosses a threshold (specifically <strong>8 elements</strong>), the HashMap automatically transforms that LinkedList into a self-balancing <strong>Red-Black Tree</strong>. This drastically improves the worst-case search performance from O(n) to an extremely fast <strong>O(log n)</strong>.</p>\n\n<p><strong>Step 4: Rehashing (Load Factor)</strong></p>\n<p>When the HashMap becomes 75% full (triggered by the default <code>0.75 Load Factor</code>), it automatically doubles its internal array capacity (e.g., from 16 to 32 buckets). It must then painstakingly recalculate the hashes for every single existing element and redistribute them into the new larger array. This is an expensive operation, which is why explicitly initializing a HashMap with a known capacity is a high-performance best practice.</p>"

    },
    {
        "type": "theory",
        "content": "Double spending is a critical issue in payment gateways. If a user impatiently clicks 'Submit Payment' twice, the browser might send two identical API requests simultaneously.\n\n**Solution: Idempotency Keys**\n1. The frontend generates a unique UUID (the Idempotency Key) for the transaction and attaches it to the HTTP Headers of the `POST` request.\n2. When the server receives the request, it checks a fast in-memory database (like **Redis**) to see if this UUID already exists.\n3. **Request 1** arrives, the UUID is not found. The server locks the UUID in Redis, processes the actual payment with Stripe/Visa, and saves the successful HTTP response in Redis against that exact UUID.\n4. **Request 2** arrives just milliseconds later. The server checks Redis, sees the UUID is already locked/processed, and immediately returns the cached success response *without* ever hitting the payment gateway a second time."

        "content": "Bank Scenario: Two users try to withdraw the exact same last $100 from a joint account at the exact same millisecond. How do you handle this?"
    },
    {
        "type": "theory",
        "content": "This is a classic **Race Condition**. If both threads read the balance as $100 simultaneously, both will pass the validation check, resulting in the account illegally going to -$100.\n\n**Solution 1: Pessimistic Locking (Database Level)**\nUse `SELECT * FROM accounts WHERE id = 1 FOR UPDATE`. This strictly locks the physical database row. The first transaction acquires the lock, while the second transaction is forced to wait until the first commits or rolls back. It is incredibly safe, but severely degrades system performance under high load.\n\n**Solution 2: Optimistic Locking (Hibernate/Application Level - Preferred)**\nAdd a `@Version` column (an integer) to the Account entity. \n1. Both threads read the balance ($100) and version (`v=1`).\n2. Thread A deducts $100 and updates the row: `UPDATE accounts SET balance = 0, version = 2 WHERE id = 1 AND version = 1`. This fully succeeds.\n3. Thread B tries to update: `UPDATE accounts ... WHERE id = 1 AND version = 1`. Because Thread A already changed the database version to 2, Thread B's query affects 0 rows. \n4. Hibernate detects this 0 row update and violently throws an `OptimisticLockException`. You catch this exception and tell User B: \"Transaction failed due to concurrent modification, please try again.\""
    },

        "content": "In a legacy monolithic application, you simply use Spring's `@Transactional` to roll back the entire database. However, in Microservices, the 'Account Service' and 'Wallet Service' have completely different, physically isolated databases. You cannot use a standard database transaction across the network.\n\n**Solution: The Saga Pattern (Event-Driven Architecture)**\nInstead of a single distributed lock (like the extremely slow Two-Phase Commit / 2PC), you use **Compensating Transactions**.\n1. Account Service deducts $100 and publishes a `PaymentDeductedEvent` to a Kafka broker.\n2. Wallet Service consumes the event and attempts to deposit $100. \n3. If Wallet Service's database is down and it fails, it publishes a `DepositFailedEvent` back to Kafka.\n4. Account Service listens for `DepositFailedEvent` and automatically executes a **Compensating Transaction**: it runs a brand new SQL query to refund the $100 back to the user's account, achieving **Eventual Consistency**."

        "type": "theory",
        "content": "In a monolithic application, you rely on a single ACID database transaction to commit or rollback. In microservices, a single user request might modify databases across three different services. A traditional distributed transaction (2-Phase Commit) locks databases and ruins performance.\n\nThe **Saga pattern is used to manage distributed transactions** in microservices. It utilizes a sequence of local transactions. If Service A and Service B succeed, but Service C fails, the Saga pattern triggers 'Compensating Actions'\u2014automated rollback events sent back to Service B and A to undo their local commits and restore data consistency."

        "type": "theory",
        "content": "In a distributed system, if Service A calls Service B, and Service B is down, Service A will hang, waiting for a timeout. If a thousand requests come in, Service A exhausts all its threads and crashes too (cascading failure).\n\nThe Circuit Breaker (e.g., Resilience4j) solves this. If Service B fails consecutively past a threshold, the Circuit Breaker **trips to the 'Open' state, instantly rejecting new requests** and returning a fallback response. This prevents thread exhaustion and gives Service B time to recover before the circuit transitions to a 'Half-Open' probing state."

        "content": "Explain the mechanics of Garbage Collection (GC) in Java. How does the G1 Garbage Collector work?"
    },
    {
        "type": "theory",
        "content": "Garbage Collection (GC) is a daemon thread in the JVM that automatically reclaims heap memory by destroying objects that are no longer reachable by the application (i.e., they have no active references). \n\nThe traditional JVM Heap is divided into Generations: **Young Generation** (where new objects are born) and **Old Generation** (where long-surviving objects are moved). When the Young Generation fills up, a Minor GC occurs. When the Old Generation fills up, a Major GC (Stop-The-World pause) occurs, freezing all application threads.\n\n**Garbage-First (G1) GC** (default since Java 9) revolutionized this process. Instead of massive contiguous generational spaces, G1 partitions the entire heap into hundreds of small, equal-sized regions. During a GC cycle, G1 concurrently analyzes the regions and **prioritizes clearing the specific regions containing the most garbage first**. This drastically reduces Stop-The-World pause times and makes GC highly predictable.\n\n*Note: Overriding the `finalize()` method is highly discouraged because there is absolutely no guarantee when (or if) the GC will run it.*"

        "content": "<table>\n    <tr><th>Method</th><th>Usage</th><th>Idempotent?</th></tr>\n    <tr><td>PUT</td><td>Replaces the entire resource representation. If a field is omitted, it sets it to null.</td><td>Yes</td></tr>\n    <tr><td>PATCH</td><td>Applies partial modifications to a resource. Only updates the provided fields.</td><td>No (usually)</td></tr>\n    <tr><td>POST</td><td>Creates brand new resources.</td><td>No</td></tr>\n</table>\n\nYou technically can use `POST` for updating a resource, but it violates REST architectural constraints. **POST is intended for creating new resources and is not idempotent** (calling it twice creates two resources), whereas updates should generally be idempotent."
    },

        "content": "What improvement can you suggest in: `select * from orders where customer_id in (select customer_id from customers where status='active');`"
    },
    {
        "type": "theory",
        "content": "Using the `IN` clause with a correlated subquery can be highly inefficient on large datasets, as it may force the database to scan the inner query repeatedly. \n\n**It should be optimized using an INNER JOIN** or an `EXISTS` clause. An `INNER JOIN` allows the database engine's optimizer to build a far more efficient execution plan using indexes. Example: `SELECT o.* FROM orders o INNER JOIN customers c ON o.customer_id = c.customer_id WHERE c.status = 'active';`"

        "lang": "java",
        "content": "public static int removeDuplicates(int[] arr) {\n    if (arr.length == 0) return 0;\n    int j = 0;\n    for (int i = 1; i < arr.length; i++) {\n        // If elements are different, move unique element forward\n        if (arr[i] != arr[j]) {\n            j++;\n            arr[j] = arr[i];\n        }\n    }\n    return j + 1; // Number of unique elements\n}"

        "type": "theory",
        "content": "Java 9 introduced several critical architectural features:\n1. **Project Jigsaw (Java Platform Module System)**: Allows modularizing large codebases and strictly controlling which packages are visible to other modules, deeply improving security and reducing the JVM footprint.\n2. **JShell**: A REPL (Read-Eval-Print Loop) for instantly testing snippets of Java code without writing full classes.\n3. **Factory Methods for Collections**: Introduced `List.of()`, `Set.of()`, and `Map.of()` to create immutable collections seamlessly.\n4. **Private Methods in Interfaces**: Interfaces can now contain private methods to share common logic between `default` methods without exposing it to implementing classes."

        "type": "theory",
        "content": "HTTP Status Codes indicate the result of a request:\n- **2xx (Success)**: The action was successfully received and accepted (e.g., 200 OK, 201 Created).\n- **3xx (Redirection)**: Further action needs to be taken to complete the request.\n- **4xx (Client Error)**: **The request contains bad syntax or cannot be fulfilled.** (e.g., 400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found).\n- **5xx (Server Error)**: The server failed to fulfill a valid request (e.g., 500 Internal Server Error)."

        "content": "What is Load Factor in collections?"
    },
    {
        "type": "theory",
        "content": "Load Factor is a measure that decides when a hash-based collection (like `HashMap` or `HashSet`) should automatically resize its capacity. The default load factor in Java is `0.75`. This means that when the HashMap reaches 75% of its total bucket capacity, it triggers a \"rehash\" operation, immediately doubling its bucket size to maintain fast O(1) performance and reduce hash collisions."

        "content": "What are User Defined Types (UDT) and their use?"
    },
    {
        "type": "theory",
        "content": "A User-Defined Type (UDT) allows developers to create custom, complex data types inside a relational database (like PostgreSQL). For example, instead of adding `address_city`, `address_zip`, and `address_street` as flat columns across multiple tables, you can execute `CREATE TYPE address_type AS (city VARCHAR, zip INT, street VARCHAR)`. \n\nThis allows you to strictly enforce a reusable schema definition across the database, bringing object-oriented structure directly into SQL."

    {
        "type": "question",
        "content": "What is Encapsulation? Provide a detailed real-world example."
    },
    {
        "type": "theory",
        "content": "**Encapsulation** is the mechanism of wrapping the data (variables) and code acting on the data (methods) together as a single unit. It restricts direct access to some of an object's components, which prevents accidental modification of data. In Java, this is strictly achieved by declaring variables as `private` and providing `public` getter and setter methods to access and modify the data with validation.\n\n**Real-World Example (Bank ATM)**:\nA bank account balance is encapsulated. You cannot directly change your balance (e.g., `account.balance = 1000000`). You must use the ATM interface (the public method like `deposit()` or `withdraw()`). The ATM checks if you have sufficient funds and the correct PIN before it alters the internal balance.\n\n**Key Difference vs Abstraction**:\nAbstraction is about hiding **complexity** (What does it do?). Encapsulation is about hiding **data state** (How is the data protected?)."
    },
    {
        "type": "question",
        "content": "What is the Diamond Problem (Multiple Inheritance) in Java? How is it resolved?"
    },
    {
        "type": "theory",
        "content": "The **Diamond Problem** occurs in multiple inheritance when a class inherits from two parent classes that both have a method with the exact same signature. The compiler becomes confused about which parent's method to execute.\n\nJava completely prevents this with classes by **not allowing multiple inheritance for classes** (a class can only `extend` one parent). \n\nHowever, in **Java 8**, interfaces can now have `default` methods. If a class implements two interfaces (`InterfaceA` and `InterfaceB`), and both have a default method named `show()`, the Diamond Problem reappears! \n\n**Resolution**: Java forces the implementing class to **override the conflicting method** and explicitly choose which parent's method to call using the `super` keyword, like this: `InterfaceA.super.show();`."
    },

    {
        "type": "question",
        "content": "Why is the String class heavily strictly Immutable in Java?"
    },
    {
        "type": "theory",
        "content": "This is an extremely common banking interview question. String is immutable for three critical reasons:\n1. **Security**: Strings are heavily used to store sensitive data like database URLs, usernames, and passwords. If String were mutable, a malicious thread could intercept and alter the string reference before it hits the database.\n2. **String Pool Caching**: Because Strings cannot change, Java can safely cache them in a special memory area called the String Constant Pool. If multiple variables contain the exact same text, they simply point to the exact same memory address, saving massive amounts of RAM.\n3. **Thread Safety**: Immutable objects are inherently completely thread-safe. Multiple threads can read a String simultaneously without requiring synchronized locks."
    },
    {
        "type": "question",
        "content": "ConcurrentHashMap vs Collections.synchronizedMap() - Why is one preferred?"
    },
    {
        "type": "theory",
        "content": "<table>\n<tr><th>Feature</th><th>Collections.synchronizedMap()</th><th>ConcurrentHashMap</th></tr>\n<tr><td><strong>Locking Mechanism</strong></td><td><strong>Object-Level Locking.</strong> Uses a single massive global lock for the entire map object.</td><td><strong>Segment-Level Locking (Lock Stripping).</strong> Divides the map into segments (usually 16 independent locks).</td></tr>\n<tr><td><strong>Concurrency / Throughput</strong></td><td>Terrible under load. If Thread A writes, Thread B is completely blocked from reading or writing anything until A finishes.</td><td>Incredible under load. Thread A can write to Segment 1 while Thread B simultaneously writes to Segment 2. Reads do not block at all.</td></tr>\n<tr><td><strong>Null Handling</strong></td><td>Allows one <code>null</code> key and multiple <code>null</code> values (if the underlying map is HashMap).</td><td>Strictly forbids <code>null</code> keys and <code>null</code> values (throws NullPointerException).</td></tr>\n</table>"
    },
    {
        "type": "question",
        "content": "Why use the ExecutorService framework instead of manually creating Threads?"
    },
    {
        "type": "theory",
        "content": "Manually doing `new Thread(() -> {}).start()` inside a web request loop is a massive anti-pattern.\n1. **Resource Exhaustion**: Threads are heavy OS-level objects. Spawning 10,000 unmanaged threads will crash the JVM with an `OutOfMemoryError`.\n2. **Context Switching Overhead**: The CPU spends more time switching between thousands of threads than actually executing logic.\n\nThe **ExecutorService** solves this by implementing a **Thread Pool**. It creates a fixed number of reusable threads (e.g., 50). When a task arrives, it is handed to an idle thread. When the task finishes, the thread doesn't die; it returns to the pool to process the next task, saving immense creation/destruction overhead."
    },
    {
        "type": "question",
        "content": "Fail-Fast vs Fail-Safe Iterators?"
    },
    {
        "type": "theory",
        "content": "- **Fail-Fast**: (e.g., `ArrayList`, `HashMap`). These iterate directly over the actual underlying collection. If Thread B attempts to structurally modify the collection (add or remove elements) while Thread A is currently iterating through it, the Iterator immediately aborts and throws a `ConcurrentModificationException`.\n- **Fail-Safe**: (e.g., `CopyOnWriteArrayList`, `ConcurrentHashMap`). These iterate over a **clone/snapshot** of the underlying collection. Therefore, if Thread B modifies the original collection during iteration, Thread A's iterator does not care and no exception is thrown."
    },

        "content": "Tricky Core Java Deep Dive"

    {
        "type": "question",
        "content": "What is the difference between == and equals() for objects in Java? Why is this a common interview trap?"
    },
    {
        "type": "theory",
        "content": "The <code>==</code> operator checks whether two references point to the exact same object in memory, while <code>equals()</code> checks logical equality based on the implementation of the class. In the <code>Object</code> class, <code>equals()</code> behaves exactly like <code>==</code>, but classes like <code>String</code>, <code>Integer</code>, and many domain objects override it to compare actual content rather than memory addresses.<div class=\"recall-anchor\">MEMORY HOOK: <code>==</code> means \"same box\", <code>equals()</code> means \"same value inside the box\".</div>The trap is that developers often remember the rule only for <code>String</code> but forget it for custom classes. If you create two separate <code>Employee</code> objects with the same id and name, <code>==</code> will be false because they are different objects. Unless you override <code>equals()</code>, even <code>equals()</code> will also return false. This is why collections like <code>HashSet</code> can behave unexpectedly for custom objects."
    },
    {
        "type": "code",
        "content": "class Employee {\n    int id;\n    Employee(int id) {\n        this.id = id;\n    }\n}\n\npublic class EqualityDemo {\n    public static void main(String[] args) {\n        String s1 = new String(\"java\");\n        String s2 = new String(\"java\");\n\n        System.out.println(s1 == s2);       // false\n        System.out.println(s1.equals(s2));  // true\n\n        Employee e1 = new Employee(101);\n        Employee e2 = new Employee(101);\n\n        System.out.println(e1 == e2);       // false\n        System.out.println(e1.equals(e2));  // false, because equals() not overridden\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "Explain the equals() and hashCode() contract. Why must both be overridden together?"
    },
    {
        "type": "theory",
        "content": "The contract is simple but extremely important. If two objects are considered equal by <code>equals()</code>, they must return the same <code>hashCode()</code>. If you override only <code>equals()</code> and not <code>hashCode()</code>, hash-based collections like <code>HashMap</code> and <code>HashSet</code> break logically because they first use <code>hashCode()</code> to find the bucket and then use <code>equals()</code> to compare inside that bucket.<table><tr><th>Rule</th><th>Meaning</th></tr><tr><td><code>equals()</code> true</td><td><code>hashCode()</code> must be same</td></tr><tr><td><code>hashCode()</code> same</td><td><code>equals()</code> may be true or false</td></tr><tr><td>Override one</td><td>Override both for value objects</td></tr></table><div class=\"recall-anchor\">MEMORY HOOK: Hash first, equals next. Wrong hashCode means object goes to the wrong house before comparison even starts.</div>This is one of the most common real-world bugs in Java interviews. A candidate says \"Set removes duplicates\", but for custom objects it only works correctly if <code>equals()</code> and <code>hashCode()</code> are implemented consistently."
    },
    {
        "type": "code",
        "content": "import java.util.HashSet;\nimport java.util.Objects;\nimport java.util.Set;\n\nclass User {\n    private int id;\n    private String name;\n\n    User(int id, String name) {\n        this.id = id;\n        this.name = name;\n    }\n\n    @Override\n    public boolean equals(Object obj) {\n        if (this == obj) return true;\n        if (!(obj instanceof User)) return false;\n        User other = (User) obj;\n        return id == other.id && Objects.equals(name, other.name);\n    }\n\n    @Override\n    public int hashCode() {\n        return Objects.hash(id, name);\n    }\n}\n\npublic class HashContractDemo {\n    public static void main(String[] args) {\n        Set<User> set = new HashSet<>();\n        set.add(new User(1, \"Sagar\"));\n        set.add(new User(1, \"Sagar\"));\n\n        System.out.println(set.size()); // 1\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "Why is String immutable in Java, and why is that considered a design advantage?"
    },
    {
        "type": "theory",
        "content": "A <code>String</code> object cannot be changed after creation. Every modification-like operation such as <code>concat()</code>, <code>replace()</code>, or <code>substring()</code> produces a new object rather than mutating the existing one. This design gives Java several powerful advantages: security, thread safety, hashcode caching, and efficient String Pool reuse. If Strings were mutable, a reference shared across modules could be altered unexpectedly, which would be dangerous for file paths, database URLs, class loading, and security credentials.<table><tr><th>Benefit</th><th>Why it matters</th></tr><tr><td>Security</td><td>Critical values cannot be silently modified</td></tr><tr><td>Thread Safety</td><td>Immutable objects are naturally safe to share</td></tr><tr><td>String Pool</td><td>Same literals can be reused safely</td></tr><tr><td>Hash caching</td><td>Useful when String is a HashMap key</td></tr></table><div class=\"recall-anchor\">MEMORY HOOK: Mutable key is dangerous. Immutable String makes reuse safe.</div>This is a favorite interview question because it tests whether you know both the language behavior and the design reasoning behind it."
    },
    {
        "type": "question",
        "content": "How do you create an immutable class in Java?"
    },
    {
        "type": "theory",
        "content": "To make a class immutable, you typically follow five rules. Make the class <code>final</code> so it cannot be extended. Make all fields <code>private final</code>. Initialize all fields through the constructor. Provide only getters and no setters. If the class contains mutable objects like <code>Date</code>, <code>List</code>, or arrays, return defensive copies instead of exposing the original internal reference.<div class=\"recall-anchor\">MEMORY HOOK: final class, final fields, constructor only, no setters, defensive copy.</div>The real trap is not with primitives or Strings, but with mutable nested fields. Many candidates claim their class is immutable while returning the original <code>Date</code> or <code>List</code> reference from a getter, which completely breaks immutability."
    },
    {
        "type": "code",
        "content": "import java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.List;\n\nfinal class Student {\n    private final int id;\n    private final String name;\n    private final List<String> skills;\n\n    public Student(int id, String name, List<String> skills) {\n        this.id = id;\n        this.name = name;\n        this.skills = new ArrayList<>(skills); // defensive copy\n    }\n\n    public int getId() {\n        return id;\n    }\n\n    public String getName() {\n        return name;\n    }\n\n    public List<String> getSkills() {\n        return Collections.unmodifiableList(skills);\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "What is the difference between String, StringBuilder, and StringBuffer?"
    },
    {
        "type": "theory",
        "content": "All three represent character sequences, but their mutability and thread-safety differ greatly. <code>String</code> is immutable, so every modification creates a new object. <code>StringBuilder</code> is mutable and not synchronized, making it the fastest choice for single-threaded string manipulation. <code>StringBuffer</code> is mutable and synchronized, making it thread-safe but slower than <code>StringBuilder</code> in most cases.<table><tr><th>Type</th><th>Mutable?</th><th>Thread-safe?</th><th>Use case</th></tr><tr><td>String</td><td>No</td><td>Yes by immutability</td><td>Read-only text</td></tr><tr><td>StringBuilder</td><td>Yes</td><td>No</td><td>Fast single-threaded concatenation</td></tr><tr><td>StringBuffer</td><td>Yes</td><td>Yes</td><td>Multi-threaded mutable text</td></tr></table><div class=\"recall-anchor\">MEMORY HOOK: Builder is fast, Buffer is safe, String is fixed.</div>The interview trap is that people often answer only \"StringBuffer is thread-safe\" without explaining why <code>StringBuilder</code> is usually preferred in modern application code."
    },
    {
        "type": "question",
        "content": "What is the difference between final, finally, and finalize()?"
    },
    {
        "type": "theory",
        "content": "<code>final</code> is a keyword used to restrict classes, methods, or variables. <code>finally</code> is a block used with exception handling and is intended for cleanup code that should run whether an exception occurs or not. <code>finalize()</code> was a method called by the garbage collector before reclaiming an object, but it is unreliable and deprecated for removal in modern Java because its execution timing is unpredictable.<table><tr><th>Term</th><th>Purpose</th></tr><tr><td><code>final</code></td><td>Restriction on inheritance, overriding, or reassignment</td></tr><tr><td><code>finally</code></td><td>Cleanup block in exception handling</td></tr><tr><td><code>finalize()</code></td><td>Old GC hook, unreliable, should be avoided</td></tr></table><div class=\"recall-anchor\">MEMORY HOOK: final = lock it, finally = clean it, finalize = forget it.</div>This question is common because the three words sound similar but belong to completely different parts of the language."
    },
    {
        "type": "question",
        "content": "Does finally always execute in Java? What are the exceptions?"
    },
    {
        "type": "theory",
        "content": "In normal control flow, the <code>finally</code> block executes whether an exception occurs or not, even if there is a <code>return</code> inside <code>try</code> or <code>catch</code>. However, it may not execute in abnormal JVM termination scenarios such as <code>System.exit(0)</code>, JVM crash, power failure, or a fatal native error.<div class=\"recall-anchor\">MEMORY HOOK: finally is almost always executed, but not after the JVM is gone.</div>Interviewers love this question because many candidates say \"finally always runs\" without knowing the edge cases. The correct answer is: it runs in regular program control, but not when the process itself terminates before it gets the chance."
    },
    {
        "type": "code",
        "content": "public class FinallyDemo {\n    public static int test() {\n        try {\n            return 10;\n        } finally {\n            System.out.println(\"finally executed\");\n        }\n    }\n\n    public static void main(String[] args) {\n        System.out.println(test());\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "What is the difference between checked and unchecked exceptions?"
    },
    {
        "type": "theory",
        "content": "Checked exceptions are verified by the compiler. If a method may throw one, you must either handle it with <code>try-catch</code> or declare it using <code>throws</code>. Unchecked exceptions are subclasses of <code>RuntimeException</code> and are not enforced by the compiler. They usually indicate programming errors such as null handling mistakes, illegal arguments, or index violations.<table><tr><th>Type</th><th>Checked by compiler?</th><th>Examples</th></tr><tr><td>Checked Exception</td><td>Yes</td><td><code>IOException</code>, <code>SQLException</code></td></tr><tr><td>Unchecked Exception</td><td>No</td><td><code>NullPointerException</code>, <code>ArithmeticException</code>, <code>IllegalArgumentException</code></td></tr></table><div class=\"recall-anchor\">MEMORY HOOK: Checked = recoverable external problem, Unchecked = coding bug or invalid usage.</div>The important interview point is not just the definition, but when to use each category while designing APIs."
    },
    {
        "type": "question",
        "content": "What is exception propagation in Java?"
    },
    {
        "type": "theory",
        "content": "Exception propagation means that if a method does not handle an exception, it passes up the call stack to its caller. This continues until some method handles it, or until it reaches the JVM, which then terminates the program and prints the stack trace. Propagation mainly applies to unchecked exceptions automatically, while checked exceptions must still be declared or handled at compile time.<div class=\"recall-anchor\">MEMORY HOOK: If method A cannot handle it, the exception climbs upward looking for someone who can.</div>This concept matters in interviews because it explains why a bug may appear far away from the actual line where the wrong state began."
    },
    {
        "type": "code",
        "content": "public class PropagationDemo {\n    static void method3() {\n        int x = 10 / 0;\n    }\n\n    static void method2() {\n        method3();\n    }\n\n    static void method1() {\n        method2();\n    }\n\n    public static void main(String[] args) {\n        try {\n            method1();\n        } catch (ArithmeticException e) {\n            System.out.println(\"Handled in main: \" + e);\n        }\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "What is the difference between throw and throws in Java?"
    },
    {
        "type": "theory",
        "content": "<code>throw</code> is used inside a method body to explicitly throw a specific exception object. <code>throws</code> is used in a method signature to declare that the method may pass certain exceptions to the caller. One creates the exception flow; the other documents and delegates responsibility.<table><tr><th>Keyword</th><th>Used where?</th><th>Purpose</th></tr><tr><td><code>throw</code></td><td>Inside method body</td><td>Actually throws an exception object</td></tr><tr><td><code>throws</code></td><td>Method signature</td><td>Declares possible exceptions</td></tr></table><div class=\"recall-anchor\">MEMORY HOOK: throw = do it now, throws = warning for caller.</div>This is often asked with custom exceptions, so always be ready to explain both together."
    },
    {
        "type": "code",
        "content": "public class ThrowVsThrowsDemo {\n    static void validateAge(int age) throws Exception {\n        if (age < 18) {\n            throw new Exception(\"Age must be 18 or above\");\n        }\n    }\n\n    public static void main(String[] args) {\n        try {\n            validateAge(15);\n        } catch (Exception e) {\n            System.out.println(e.getMessage());\n        }\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "Can we have try without catch in Java?"
    },
    {
        "type": "theory",
        "content": "Yes, but only if it is followed by a <code>finally</code> block. A <code>try</code> block must be followed by either at least one <code>catch</code> block or a <code>finally</code> block. This is useful when you do not want to handle the exception locally but still want cleanup logic to run.<div class=\"recall-anchor\">MEMORY HOOK: try cannot stand alone. It needs catch or finally.</div>Interviewers ask this because many candidates think <code>catch</code> is mandatory after every <code>try</code>, which is not correct."
    },
    {
        "type": "code",
        "content": "public class TryFinallyDemo {\n    public static void main(String[] args) {\n        try {\n            System.out.println(\"Inside try\");\n        } finally {\n            System.out.println(\"Cleanup in finally\");\n        }\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "Can we overload the main() method in Java? Which main method does JVM call?"
    },
    {
        "type": "theory",
        "content": "Yes, you can overload <code>main()</code> just like any other method by changing its parameter list. However, the JVM only looks for the exact entry-point signature <code>public static void main(String[] args)</code>. Any overloaded version is just a normal method and will not be used as the application starting point.<div class=\"recall-anchor\">MEMORY HOOK: You can overload main, but JVM has only one door key.</div>This is a classic tricky question because candidates confuse \"allowed by Java syntax\" with \"used by JVM as entry point\"."
    },
    {
        "type": "code",
        "content": "public class MainOverloadDemo {\n    public static void main(String[] args) {\n        System.out.println(\"JVM starts here\");\n        main(10);\n    }\n\n    public static void main(int x) {\n        System.out.println(\"Overloaded main: \" + x);\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "Can static methods be overridden in Java?"
    },
    {
        "type": "theory",
        "content": "No, static methods are not overridden because overriding is resolved at runtime using dynamic dispatch, and static methods belong to the class, not the object. If a subclass declares a static method with the same signature as the parent, it is called method hiding, not overriding. Which method gets called depends on the reference type, not the actual object type.<div class=\"recall-anchor\">MEMORY HOOK: Instance methods override, static methods hide.</div>This is a strong interview trap because candidates often say \"yes, overridden\", but the correct term is <strong>method hiding</strong>."
    },
    {
        "type": "code",
        "content": "class Parent {\n    static void show() {\n        System.out.println(\"Parent static\");\n    }\n}\n\nclass Child extends Parent {\n    static void show() {\n        System.out.println(\"Child static\");\n    }\n}\n\npublic class StaticHidingDemo {\n    public static void main(String[] args) {\n        Parent obj = new Child();\n        obj.show(); // Parent static\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "Can private methods be overridden in Java?"
    },
    {
        "type": "theory",
        "content": "No, private methods are not visible to subclasses, so they cannot be overridden. If a subclass defines a method with the same name and signature, it is an entirely new method unrelated to the parent's private method. Since overriding requires inheritance visibility, a private method is excluded from runtime polymorphism.<div class=\"recall-anchor\">MEMORY HOOK: If child cannot see it, child cannot override it.</div>This question is asked to test whether you understand visibility rules, not just memorized polymorphism definitions."
    },
    {
        "type": "question",
        "content": "What is method hiding and how is it different from overriding?"
    },
    {
        "type": "theory",
        "content": "Method overriding happens with instance methods and is resolved at runtime based on the actual object. Method hiding happens with static methods and is resolved at compile time based on the reference type. Overriding supports runtime polymorphism, while hiding does not.<table><tr><th>Feature</th><th>Overriding</th><th>Hiding</th></tr><tr><td>Applies to</td><td>Instance methods</td><td>Static methods</td></tr><tr><td>Resolution</td><td>Runtime</td><td>Compile time</td></tr><tr><td>Polymorphism</td><td>Yes</td><td>No</td></tr></table><div class=\"recall-anchor\">MEMORY HOOK: Overriding is object-based, hiding is reference-based.</div>"
    },
    {
        "type": "question",
        "content": "What is the difference between shallow copy and deep copy?"
    },
    {
        "type": "theory",
        "content": "A shallow copy duplicates the top-level object but still shares references to nested mutable objects. A deep copy duplicates both the top-level object and the nested objects, so changes in one copy do not affect the other. This matters in interviews because candidates often say \"copy created\" without specifying whether internal state is still shared.<div class=\"recall-anchor\">MEMORY HOOK: Shallow copy copies the house key, deep copy builds a new house.</div>Whenever a class contains arrays, lists, maps, or other mutable references, interviewers may ask whether your copy is truly independent."
    },
    {
        "type": "code",
        "content": "class Address {\n    String city;\n    Address(String city) {\n        this.city = city;\n    }\n}\n\nclass Employee {\n    String name;\n    Address address;\n\n    Employee(String name, Address address) {\n        this.name = name;\n        this.address = address;\n    }\n\n    Employee(Employee other) {\n        this.name = other.name;\n        this.address = new Address(other.address.city); // deep copy\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "What is cloning in Java? Why is Cloneable considered tricky?"
    },
    {
        "type": "theory",
        "content": "Cloning in Java usually refers to creating an object copy using the <code>clone()</code> method inherited from <code>Object</code>. To make it work, the class must implement <code>Cloneable</code>; otherwise, <code>CloneNotSupportedException</code> is thrown. It is considered tricky because <code>clone()</code> performs only a shallow copy by default, has awkward design rules, and often leads to bugs with mutable fields. That is why many modern codebases prefer copy constructors or factory methods instead.<div class=\"recall-anchor\">MEMORY HOOK: clone() looks easy, but shared nested state makes it dangerous.</div>"
    },
    {
        "type": "question",
        "content": "What is serialization in Java? What is the use of transient?"
    },
    {
        "type": "theory",
        "content": "Serialization is the process of converting an object's state into a byte stream so it can be stored in a file, sent over the network, or cached. A class typically implements <code>Serializable</code> to indicate that its objects can be serialized. The <code>transient</code> keyword marks fields that should not be serialized, usually because they are sensitive, derived, temporary, or not meaningful outside the current runtime context.<div class=\"recall-anchor\">MEMORY HOOK: Serializable saves object state, transient tells Java what not to pack.</div>A classic interview example is passwords: even if an object is serialized, a password field marked <code>transient</code> will not be written to the stream."
    },
    {
        "type": "code",
        "content": "import java.io.Serializable;\n\nclass Account implements Serializable {\n    private String username;\n    private transient String password;\n\n    public Account(String username, String password) {\n        this.username = username;\n        this.password = password;\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "Why is char[] preferred over String for storing passwords?"
    },
    {
        "type": "theory",
        "content": "A <code>String</code> is immutable, so once a password is created as a String, it stays in memory until the garbage collector removes it, and you cannot explicitly erase its contents. A <code>char[]</code> can be overwritten manually after use, reducing the time the sensitive data remains readable in memory. This is why security-focused APIs often prefer character arrays for passwords.<div class=\"recall-anchor\">MEMORY HOOK: String stays, char[] can be wiped.</div>This is a great question because it connects immutability, security, and practical API design in one answer."
    },
    {
        "type": "question",
        "content": "What is autoboxing and unboxing? What problem can it create in interviews?"
    },
    {
        "type": "theory",
        "content": "Autoboxing is the automatic conversion of a primitive like <code>int</code> into its wrapper class <code>Integer</code>. Unboxing is the reverse conversion from wrapper to primitive. The tricky part is that wrappers can be <code>null</code>, so unboxing a null value throws <code>NullPointerException</code>.<div class=\"recall-anchor\">MEMORY HOOK: Primitive cannot be null, wrapper can. Null + unboxing = crash.</div>This is especially dangerous in code involving maps, databases, and JSON parsing where wrapper values may legitimately be absent."
    },
    {
        "type": "code",
        "content": "public class AutoBoxingDemo {\n    public static void main(String[] args) {\n        Integer count = null;\n        int value = count; // NullPointerException during unboxing\n        System.out.println(value);\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "Why does Integer comparison with == sometimes work and sometimes fail?"
    },
    {
        "type": "theory",
        "content": "The <code>Integer</code> class uses internal caching for values typically in the range -128 to 127. If you create wrapper objects using autoboxing within this range, Java may return the same cached object, so <code>==</code> may appear to work. Outside that range, different objects are usually created, so <code>==</code> becomes false even when the numeric values are equal. The correct way to compare wrapper values is <code>equals()</code> or explicit primitive unboxing.<div class=\"recall-anchor\">MEMORY HOOK: Small Integers are cached, large ones usually are not.</div>This is a famous interview trap because it produces inconsistent-looking results that reveal whether the candidate really understands reference comparison."
    },
    {
        "type": "code",
        "content": "public class IntegerCacheDemo {\n    public static void main(String[] args) {\n        Integer a = 127;\n        Integer b = 127;\n        Integer x = 128;\n        Integer y = 128;\n\n        System.out.println(a == b); // true\n        System.out.println(x == y); // false\n        System.out.println(x.equals(y)); // true\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "What is a static block in Java? When does it execute?"
    },
    {
        "type": "theory",
        "content": "A static block is a block of code used for class-level initialization. It executes only once, when the class is first loaded into memory by the JVM, before any object is created and before the main method uses the class. It is typically used for one-time initialization of static variables or startup logic that belongs to the class itself.<div class=\"recall-anchor\">MEMORY HOOK: Constructor is for object birth, static block is for class birth.</div>Interviewers may combine this with execution-order questions involving static variables, instance blocks, and constructors."
    },
    {
        "type": "code",
        "content": "public class StaticBlockDemo {\n    static {\n        System.out.println(\"Static block executed\");\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"Main method executed\");\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "What is the order of execution in Java: static block, instance block, constructor?"
    },
    {
        "type": "theory",
        "content": "The order is: static block executes first when the class is loaded, instance initialization block executes next whenever an object is created, and then the constructor runs. If multiple static or instance blocks exist, they execute in the order they appear in the class. This is a classic output-based interview question.<div class=\"recall-anchor\">MEMORY HOOK: Class loads first, object prepares next, constructor finishes last.</div>"
    },
    {
        "type": "code",
        "content": "public class ExecutionOrderDemo {\n    static {\n        System.out.println(\"1. Static block\");\n    }\n\n    {\n        System.out.println(\"2. Instance block\");\n    }\n\n    ExecutionOrderDemo() {\n        System.out.println(\"3. Constructor\");\n    }\n\n    public static void main(String[] args) {\n        new ExecutionOrderDemo();\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "What is the difference between compile-time polymorphism and runtime polymorphism?"
    },
    {
        "type": "theory",
        "content": "Compile-time polymorphism is achieved through method overloading, where the compiler decides which method to call based on the method signature. Runtime polymorphism is achieved through method overriding, where the JVM decides at runtime which overridden method to execute based on the actual object type. The key distinction is when the decision is made.<table><tr><th>Type</th><th>Achieved by</th><th>Resolved when?</th></tr><tr><td>Compile-time polymorphism</td><td>Overloading</td><td>During compilation</td></tr><tr><td>Runtime polymorphism</td><td>Overriding</td><td>During execution</td></tr></table><div class=\"recall-anchor\">MEMORY HOOK: Overloading chooses early, overriding chooses late.</div>"
    },
    {
        "type": "question",
        "content": "Can a subclass throw a broader checked exception than the parent method while overriding?"
    },
    {
        "type": "theory",
        "content": "No. When overriding a method, the child class cannot declare a broader checked exception than the parent version. It may declare the same exception, a narrower checked exception, or no checked exception at all. For unchecked exceptions, there is no such restriction. This rule exists so that code using the parent reference is not forced to handle unexpected broader checked exceptions introduced by the child.<div class=\"recall-anchor\">MEMORY HOOK: Child can narrow checked exceptions, not widen them.</div>This is a favorite advanced core Java interview question because it mixes inheritance with exception rules."
    },
    {
        "type": "question",
        "content": "What is deadlock in Java and how do you explain it simply in an interview?"
    },
    {
        "type": "theory",
        "content": "Deadlock occurs when two or more threads wait forever for each other to release locks, so none of them can proceed. A common example is Thread A holding Lock 1 and waiting for Lock 2, while Thread B holds Lock 2 and waits for Lock 1. The system is not crashed, but progress has stopped completely.<div class=\"recall-anchor\">MEMORY HOOK: A waits for B's lock, B waits for A's lock, both freeze forever.</div>In interviews, the strongest answer is not just the definition but also the prevention idea: enforce consistent lock ordering, reduce nested locks, or use timeout-based locking APIs."
    },
    {
        "type": "code",
        "content": "public class DeadlockDemo {\n    private static final Object lock1 = new Object();\n    private static final Object lock2 = new Object();\n\n    public static void main(String[] args) {\n        Thread t1 = new Thread(() -> {\n            synchronized (lock1) {\n                synchronized (lock2) {\n                    System.out.println(\"Thread 1 acquired both locks\");\n                }\n            }\n        });\n\n        Thread t2 = new Thread(() -> {\n            synchronized (lock2) {\n                synchronized (lock1) {\n                    System.out.println(\"Thread 2 acquired both locks\");\n                }\n            }\n        });\n\n        t1.start();\n        t2.start();\n    }\n}",
        "lang": "java"
    },
    {
        "type": "question",
        "content": "What is race condition in Java?"
    },
    {
        "type": "theory",
        "content": "A race condition happens when multiple threads access and modify shared data concurrently and the final result depends on the unpredictable order of execution. The code may work sometimes and fail at other times, which makes the bug difficult to reproduce. Operations like <code>count++</code> are dangerous because they are not atomic; they involve read, modify, and write steps.<div class=\"recall-anchor\">MEMORY HOOK: If output depends on who runs first, you have a race.</div>This is one of the most frequently asked concurrency basics because it reveals whether the candidate understands why synchronization is needed, not just how to write it."
    },
    {
        "type": "question",
        "content": "What is volatile in Java? Does it make code thread-safe?"
    },
    {
        "type": "theory",
        "content": "The <code>volatile</code> keyword tells the JVM that reads and writes of a variable should go directly to main memory, improving visibility between threads. If one thread updates a volatile variable, another thread reading it is more likely to see the latest value immediately. However, <code>volatile</code> does not make compound operations like <code>count++</code> atomic, so it does not provide full thread safety for read-modify-write logic.<div class=\"recall-anchor\">MEMORY HOOK: volatile gives visibility, not atomicity.</div>This is a high-value interview question because many candidates incorrectly think <code>volatile</code> is a complete replacement for synchronization."
    },
    {
        "type": "question",
        "content": "What is the difference between synchronized method and synchronized block?"
    },
    {
        "type": "theory",
        "content": "A synchronized method locks the monitor of the whole object instance, or the Class object if the method is static, for the entire method duration. A synchronized block locks only a specific section of code and can lock on any chosen object. Because it gives finer control and smaller lock scope, a synchronized block is usually more efficient and flexible.<table><tr><th>Feature</th><th>Synchronized Method</th><th>Synchronized Block</th></tr><tr><td>Lock scope</td><td>Entire method</td><td>Specific code section</td></tr><tr><td>Flexibility</td><td>Less</td><td>More</td></tr><tr><td>Performance</td><td>May lock too much</td><td>Can reduce contention</td></tr></table><div class=\"recall-anchor\">MEMORY HOOK: Method lock is broad, block lock is surgical.</div>"
    }
];

        document.addEventListener('DOMContentLoaded', () => {
            const track = document.getElementById('content-track');
            let currentContainer = null;

            interviewData.forEach(item => {
                if (item.type === 'category') {
                    const catEl = document.createElement('div');
                    catEl.className = 'category-header';
                    catEl.textContent = item.content;
                    track.appendChild(catEl);
                    currentContainer = null;
                    return;
                }

                if (item.type === 'question') {
                    currentContainer = document.createElement('div');
                    currentContainer.className = 'qa-container';
                    track.appendChild(currentContainer);

                    const qEl = document.createElement('h2');
                    qEl.className = 'question';
                    qEl.textContent = item.content;
                    currentContainer.appendChild(qEl);
                    return;
                }

                if (!currentContainer) {
                    currentContainer = document.createElement('div');
                    currentContainer.className = 'qa-container';
                    track.appendChild(currentContainer);
                }

                if (item.type === 'theory') {
                    const hookRegex = /\*\*(.*?)\*\*/g;
                    let theoryHTML = item.content;
                    let match;
                    const hooks = [];

                    while ((match = hookRegex.exec(item.content)) !== null) {
                        hooks.push(match[1]);
                    }

                    theoryHTML = theoryHTML.replace(/(?<!<[^>]*?)`([^`]+)`(?![^<]*?>)/g, '<code>$1</code>');
                    theoryHTML = theoryHTML.replace(hookRegex, '<strong>$1</strong>');

                    const tEl = document.createElement('div');
                    tEl.className = 'theory';

                    let lines = theoryHTML.split('\n');
                    let inTable = false;
                    let tableHTML = '';
                    let finalLines = [];

                    for (let i = 0; i < lines.length; i++) {
                        let line = lines[i].trim();
                        if (line.startsWith('|') && line.endsWith('|')) {
                            if (!inTable) {
                                inTable = true;
                                tableHTML = '<div class="table-responsive"><table>\n';
                            }
                            
                            if (line.includes('---')) continue;
                            
                            let cells = line.split('|').slice(1, -1).map(c => c.trim());
                            let rowHTML = '<tr>';
                            cells.forEach(cell => {
                                if (tableHTML.indexOf('<tr>') === -1) {
                                    rowHTML += `<th>${cell}</th>`;
                                } else {
                                    rowHTML += `<td>${cell}</td>`;
                                }
                            });
                            rowHTML += '</tr>\n';
                            tableHTML += rowHTML;
                        } else {
                            if (inTable) {
                                inTable = false;
                                tableHTML += '</table></div>';
                                finalLines.push(tableHTML);
                            }
                            finalLines.push(lines[i]);
                        }
                    }
                    if (inTable) {
                        tableHTML += '</table></div>';
                        finalLines.push(tableHTML);
                    }

                    let formattedHTML = finalLines.join('<br>');
                    formattedHTML = formattedHTML.replace(/<br>- /g, '<br>• ');
                    formattedHTML = formattedHTML.replace(/<br><div class="table-responsive">/g, '<div class="table-responsive">');
                    formattedHTML = formattedHTML.replace(/<\/div><br>/g, '</div>');

                    tEl.innerHTML = formattedHTML;
                    currentContainer.appendChild(tEl);

                    hooks.forEach(hookText => {
                        const anchorEl = document.createElement('aside');
                        anchorEl.className = 'recall-anchor';
                        anchorEl.textContent = hookText;
                        currentContainer.appendChild(anchorEl);
                    });
                }

                if (item.type === 'code') {
                    const codeBlock = document.createElement('div');
                    codeBlock.className = 'code-container';
                    
                    const pre = document.createElement('pre');
                    const code = document.createElement('code');
                    const lang = item.lang ? item.lang : 'java';
                    code.className = `language-${lang}`;
                    code.textContent = item.content;
                    
                    pre.appendChild(code);
                    codeBlock.appendChild(pre);
                    currentContainer.appendChild(codeBlock);

                    if (lang === 'java') {
                        const runBtn = document.createElement('button');
                        runBtn.className = 'run-btn';
                        runBtn.innerHTML = '▶ Run Code';
                        
                        const consoleOut = document.createElement('div');
                        consoleOut.className = 'console-output';
                        
                        runBtn.onclick = () => executeJava(item.content, runBtn, consoleOut);
                        
                        currentContainer.appendChild(runBtn);
                        currentContainer.appendChild(consoleOut);
                    }
                }
            });

            if (window.Prism) {
                Prism.highlightAll();
            }
        });

        async function executeJava(sourceCode, btn, consoleOut) {
            btn.disabled = true;
            btn.innerHTML = '⏳ Running...';
            consoleOut.style.display = 'block';
            consoleOut.className = 'console-output';
            consoleOut.textContent = 'Compiling and executing on cloud...';

            let codeToRun = sourceCode;
            if (!codeToRun.includes('public class') && !codeToRun.includes('static void main')) {
                codeToRun = `import java.util.*;
import java.util.stream.*;
import java.util.concurrent.*;
public class Main {
    public static void main(String[] args) throws Exception {
        ${sourceCode}
    }
}`;
            } else if (!codeToRun.includes('public class') && codeToRun.includes('class ')) {
                codeToRun = codeToRun.replace('class ', 'public class ');
            }

            try {
                const response = await fetch('http://localhost:8080/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeToRun })
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    consoleOut.textContent = result.output || "Program finished with no output.";
                } else {
                    consoleOut.className = 'console-output error';
                    if (result.type === 'compile') {
                        consoleOut.textContent = "COMPILATION ERROR:\n" + result.output;
                    } else if (result.type === 'run') {
                        consoleOut.textContent = "RUNTIME ERROR:\n" + result.output;
                    } else {
                        consoleOut.textContent = "SERVER ERROR:\n" + result.output;
                    }
                }
            } catch (err) {
                consoleOut.className = 'console-output error';
                consoleOut.textContent = "Network error: Make sure you are running 'python compiler_server.py' in the background!\nDetails: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '▶ Run Code';
            }
        }
    </script>
