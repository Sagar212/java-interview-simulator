    },

        "type": "code",
        "lang": "java",
        "content": "public class VolatileExample {\n    // Volatile guarantees visibility across threads\n    private volatile boolean isRunning = true;\n\n    public void stopRunning() {\n        isRunning = false; // Write becomes immediately visible\n    }\n\n    public void runWork() {\n        while (isRunning) {\n            // Do some work continuously until stopRunning() is called\n        }\n        System.out.println(\"Work stopped!\");\n    }\n}"

    },

    },
    {
        "type": "question",

    },

        "content": "How does it resolve ambiguity in Spring?"
    },
    {

        "content": "Difference between @Primary and @Qualifier?"

    {
        "type": "category",
        "content": "9) INTERFACE VS ABSTRACT CLASS"

        "type": "question",

    {
        "type": "theory",
        "content": "Even after default methods were added to interfaces, important differences remain.\n\nInterface:\n- defines contract\n- supports multiple inheritance of type\n- fields are implicitly public static final\n\nAbstract class:\n- can have instance state\n- can have constructors\n- can have protected helper methods\n- can provide partial implementation\n\nSo default methods make interfaces more powerful, but they do not replace abstract classes."

    {
        "type": "question",
        "content": "State management differences?"
    },
    {

    {

        "type": "question",

    {
        "type": "theory",

    {
        "type": "category",
        "content": "11) METHOD OVERLOADING VS OVERRIDING"

        "type": "question",
        "content": "Key differences?"
    },

        "type": "theory",

    {
        "type": "question",
        "content": "How does compile-time vs runtime binding work?"
    },
    {
        "type": "theory",

    {
        "type": "category",
        "content": "12) METHOD HIDING"

        "type": "question",
        "content": "Difference between hiding and overriding?"

    {
        "type": "theory",

        "type": "question",
        "content": "Real-world use cases?"

    {
        "type": "category",
        "content": "16) HASHMAP INTERNAL WORKING"

        "type": "question",
        "content": "How does HashMap store data?"

    {
        "type": "theory",

    },
    {
        "type": "question",
        "content": "How are collisions handled?"
    },
    {
        "type": "theory",
        "content": "If two keys land in the same bucket, HashMap stores multiple nodes in that bucket.\nTraditionally this was a linked list.\nIn Java 8+, if collisions become heavy, the bucket can be treeified."

    {
        "type": "question",
        "content": "What changed in Java 8 (treeification)?"
    },
    {
        "type": "theory",
        "content": "Java 8 introduced converting long collision chains into a red-black tree.\nThis improves worst-case lookup from O(n) to O(log n) for that bucket."

    {
        "type": "question",
        "content": "Difference from ConcurrentHashMap?"
    },
    {
        "type": "theory",
        "content": "HashMap is not thread-safe.\nConcurrentHashMap is designed for concurrent access and safe multi-thread use."
    },
    {
        "type": "category",
        "content": "17) DESIGN PATTERNS"
    },
    {
        "type": "question",
        "content": "What are creational, structural, behavioral patterns?"
    },
    {
        "type": "theory",
        "content": "A:\nCreational:\n- focus on object creation\n- examples: Singleton, Factory, Builder\n\nStructural:\n- focus on how classes/objects are composed\n- examples: Adapter, Decorator, Facade\n\nBehavioral:\n- focus on communication between objects\n- examples: Strategy, Observer, Command"

        "type": "question",
        "content": "Singleton pitfalls in multithreading?"

        "type": "question",
        "content": "When to use Builder pattern?"

    {
        "type": "theory",

        "type": "category",

        "type": "question",
        "content": "Which pattern for object creation flexibility?"

    },
    {
        "type": "category",
        "content": "19) STRING == VS EQUALS"
    },
    {
        "type": "question",
        "content": "Difference between == and equals?"
    },
    {
        "type": "theory",
        "content": "A:\n- == checks whether both references point to the same object\n- equals() checks logical content equality for String"
    },
    {
        "type": "code",
        "lang": "java",
        "content": "public class StringEqualityDemo {\n    public static void main(String[] args) {\n        String s1 = \"Hello\";              // String Pool\n        String s2 = \"Hello\";              // String Pool (reused)\n        String s3 = new String(\"Hello\");  // Heap Memory\n\n        // == compares memory references\n        System.out.println(\"s1 == s2 : \" + (s1 == s2)); // true (same pool object)\n        System.out.println(\"s1 == s3 : \" + (s1 == s3)); // false (different objects)\n\n        // .equals() compares the actual character content\n        System.out.println(\"s1.equals(s3) : \" + s1.equals(s3)); // true (content is same)\n    }\n}"
    },
    {
        "type": "question",
        "content": "What is string pool?"

    {
        "type": "theory",

    {
        "type": "question",
        "content": "How does interning work?"
    },
    {
        "type": "theory",
        "content": "intern() returns a canonical pooled String reference.\nIf the same text already exists in the pool, that reference is returned.\nOtherwise, the string is added to the pool."
    },
    {
        "type": "question",
        "content": "Why are Strings immutable?"
    },
    {
        "type": "theory",

    },

        "type": "question",

        "type": "question",

        "type": "theory",

        "type": "category",
        "content": "21) THREAD CREATION"
    },
    {
        "type": "question",
        "content": "Ways to create threads in Java?"
    },
    {
        "type": "theory",
        "content": "A:\n- extend Thread\n- implement Runnable\n- implement Callable and submit to ExecutorService\n- use executor framework\n- use higher-level async APIs like CompletableFuture"
    },
    {
        "type": "code",
        "lang": "java",
        "content": "public class ThreadCreationDemo {\n    // Way 1: Extend Thread\n    static class MyThread extends Thread {\n        public void run() {\n            System.out.println(\"Thread running via Thread class\");\n        }\n    }\n\n    // Way 2: Implement Runnable\n    static class MyRunnable implements Runnable {\n        public void run() {\n            System.out.println(\"Thread running via Runnable interface\");\n        }\n    }\n\n    public static void main(String[] args) {\n        MyThread t1 = new MyThread();\n        t1.start();\n\n        Thread t2 = new Thread(new MyRunnable());\n        t2.start();\n\n        // Way 3: Lambda (Runnable)\n        Thread t3 = new Thread(() -> System.out.println(\"Thread running via Lambda\"));\n        t3.start();\n    }\n}"

    {
        "type": "question",
        "content": "Runnable vs Thread class?"

    {
        "type": "question",
        "content": "Executor framework benefits?"
    },
    {
        "type": "theory",

        "type": "theory",

        document.addEventListener('DOMContentLoaded', () => {
            const track = document.getElementById('content-track');
            let currentContainer = null;

            interviewData.forEach(item => {
                if (item.type === 'category') {
                    const catEl = document.createElement('div');
                    catEl.className = 'category-header';
                    catEl.textContent = item.content;
                    track.appendChild(catEl);
                    currentContainer = null;
                    return;
                }

                if (item.type === 'question') {
                    currentContainer = document.createElement('div');
                    currentContainer.className = 'qa-container';
                    track.appendChild(currentContainer);

                    const qEl = document.createElement('h2');
                    qEl.className = 'question';
                    qEl.textContent = item.content;
                    currentContainer.appendChild(qEl);
                    return;
                }

                if (!currentContainer) {
                    currentContainer = document.createElement('div');
                    currentContainer.className = 'qa-container';
                    track.appendChild(currentContainer);
                }

                if (item.type === 'theory') {
                    const hookRegex = /\*\*(.*?)\*\*/g;
                    let theoryHTML = item.content;
                    let match;
                    const hooks = [];

                    while ((match = hookRegex.exec(item.content)) !== null) {
                        hooks.push(match[1]);
                    }

                    theoryHTML = theoryHTML.replace(/(?<!<[^>]*?)`([^`]+)`(?![^<]*?>)/g, '<code>$1</code>');
                    theoryHTML = theoryHTML.replace(hookRegex, '<strong>$1</strong>');

                    const tEl = document.createElement('div');
                    tEl.className = 'theory';

                    let lines = theoryHTML.split('\n');
                    let inTable = false;
                    let tableHTML = '';
                    let finalLines = [];

                    for (let i = 0; i < lines.length; i++) {
                        let line = lines[i].trim();
                        if (line.startsWith('|') && line.endsWith('|')) {
                            if (!inTable) {
                                inTable = true;
                                tableHTML = '<div class="table-responsive"><table>\n';
                            }
                            
                            if (line.includes('---')) continue;
                            
                            let cells = line.split('|').slice(1, -1).map(c => c.trim());
                            let rowHTML = '<tr>';
                            cells.forEach(cell => {
                                if (tableHTML.indexOf('<tr>') === -1) {
                                    rowHTML += `<th>${cell}</th>`;
                                } else {
                                    rowHTML += `<td>${cell}</td>`;
                                }
                            });
                            rowHTML += '</tr>\n';
                            tableHTML += rowHTML;
                        } else {
                            if (inTable) {
                                inTable = false;
                                tableHTML += '</table></div>';
                                finalLines.push(tableHTML);
                            }
                            finalLines.push(lines[i]);
                        }
                    }
                    if (inTable) {
                        tableHTML += '</table></div>';
                        finalLines.push(tableHTML);
                    }

                    let formattedHTML = finalLines.join('<br>');
                    formattedHTML = formattedHTML.replace(/<br>- /g, '<br>• ');
                    formattedHTML = formattedHTML.replace(/<br><div class="table-responsive">/g, '<div class="table-responsive">');
                    formattedHTML = formattedHTML.replace(/<\/div><br>/g, '</div>');

                    tEl.innerHTML = formattedHTML;
                    currentContainer.appendChild(tEl);

                    hooks.forEach(hookText => {
                        const anchorEl = document.createElement('aside');
                        anchorEl.className = 'recall-anchor';
                        anchorEl.textContent = hookText;
                        currentContainer.appendChild(anchorEl);
                    });
                }

                if (item.type === 'code') {
                    const codeBlock = document.createElement('div');
                    codeBlock.className = 'code-container';
                    
                    const pre = document.createElement('pre');
                    const code = document.createElement('code');
                    const lang = item.lang ? item.lang : 'java';
                    code.className = `language-${lang}`;
                    code.textContent = item.content;
                    
                    pre.appendChild(code);
                    codeBlock.appendChild(pre);
                    currentContainer.appendChild(codeBlock);

                    if (lang === 'java') {
                        const runBtn = document.createElement('button');
                        runBtn.className = 'run-btn';
                        runBtn.innerHTML = '▶ Run Code';
                        
                        const consoleOut = document.createElement('div');
                        consoleOut.className = 'console-output';
                        
                        runBtn.onclick = () => executeJava(item.content, runBtn, consoleOut);
                        
                        currentContainer.appendChild(runBtn);
                        currentContainer.appendChild(consoleOut);
                    }
                }
            });

            if (window.Prism) {
                Prism.highlightAll();
            }
        });

        async function executeJava(sourceCode, btn, consoleOut) {
            btn.disabled = true;
            btn.innerHTML = '⏳ Running...';
            consoleOut.style.display = 'block';
            consoleOut.className = 'console-output';
            consoleOut.textContent = 'Compiling and executing on cloud...';

            let codeToRun = sourceCode;
            if (!codeToRun.includes('public class') && !codeToRun.includes('static void main')) {
                codeToRun = `import java.util.*;
import java.util.stream.*;
import java.util.concurrent.*;
public class Main {
    public static void main(String[] args) throws Exception {
        ${sourceCode}
    }
}`;
            } else if (!codeToRun.includes('public class') && codeToRun.includes('class ')) {
                codeToRun = codeToRun.replace('class ', 'public class ');
            }

            try {
                const response = await fetch('http://localhost:8080/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeToRun })
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    consoleOut.textContent = result.output || "Program finished with no output.";
                } else {
                    consoleOut.className = 'console-output error';
                    if (result.type === 'compile') {
                        consoleOut.textContent = "COMPILATION ERROR:\n" + result.output;
                    } else if (result.type === 'run') {
                        consoleOut.textContent = "RUNTIME ERROR:\n" + result.output;
                    } else {
                        consoleOut.textContent = "SERVER ERROR:\n" + result.output;
                    }
                }
            } catch (err) {
                consoleOut.className = 'console-output error';
                consoleOut.textContent = "Network error: Make sure you are running 'python compiler_server.py' in the background!\nDetails: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '▶ Run Code';
            }
        }
    </script>
</body>
</html>
