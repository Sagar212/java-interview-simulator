        "content": "20. What is the difference between && and & operators?"
    },
    {
        "type": "theory",
        "content": "&& is the logical AND operator with short-circuit evaluation. & is the bitwise AND operator, which also works as a logical AND but evaluates both sides always."
    },
    {
        "type": "theory",
        "content": "Consider this code example:"
    },
    {
        "type": "code",
        "lang": "java",
        "content": "int a = 5;\nint b = 10;\nboolean result;\nresult = (a > 10) && (b++ > 5);\nSystem.out.println(\"a = \" + a + \", b = \" + b + \", result = \" + result);\nresult = (a > 10) & (b++ > 5);\nSystem.out.println(\"a = \" + a + \", b = \" + b + \", result = \" + result);Powered By"
    },
    {
        "type": "theory",
        "content": "Output:"
    },
    {
        "type": "code",
        "lang": "java",
        "content": "a = 5, b = 10, result = false\na = 5, b = 11, result = falsePowered By"
    },
    {
        "type": "theory",
        "content": "In the first case (&&), b isn't incremented because the left side is false, so evaluation short-circuits. In the second case (&), b is incremented despite the left side being false, as both sides are always evaluated."
    },

        "content": "24. Explain the difference between Runnable and Callable interfaces in Java concurrency."
    },
    {
        "type": "theory",
        "content": "Both are used for defining tasks that can be executed by threads. Runnable doesn't return a result, cannot throw checked exceptions, and thus, is simpler to use for basic tasks. Callable, on the other hand, can return a result and can throw checked exceptions. Callable is typically used with ExecutorService for asynchronous task execution."
    },
    {
        "type": "theory",
        "content": "Think of Runnable as a worker who silently does the job but doesn't report back with any information other than success or failure. Callable is a more professional worker who not only performs the task but puts together a detailed report on task results with any or all problems encountered during task execution."
    },

        "content": "Here is a thread-safe implementation of the Singleton pattern:"

    {
        "type": "code",
        "lang": "java",
        "content": "public class Singleton {\n   private static volatile Singleton instance;\n   private Singleton() {}\n   public static Singleton getInstance() {\n       if (instance == null) {\n           synchronized (Singleton.class) {\n               if (instance == null) {\n                   instance = new Singleton();\n               }\n           }\n       }\n       return instance;\n   }\n}Powered By"

        "type": "question",
        "content": "27. What is the difference between fail-fast and fail-safe iterators?"
    },
    {
        "type": "theory",
        "content": "Fail-fast iterators throw ConcurrentModificationException if the collection is modified while iterating. Examples include iterators of ArrayList and HashMap. Fail-safe iterators don't throw exceptions if the collection is modified; they work on a clone of the collection. Examples include iterators of ConcurrentHashMap and CopyOnWriteArrayList."
    },
    {
        "type": "theory",
        "content": "We use fail-fast and fail-safe iterators for different purposes in concurrent Java programming:"
    },
    {
        "type": "theory",
        "content": "Fail-fast iterators:"
    },
    {
        "type": "theory",
        "content": "Provide immediate feedback about concurrent modifications.\nHelp detect programming errors early in the development process.\nEnsure data consistency by preventing iteration over a collection that has been modified."
    },
    {
        "type": "theory",
        "content": "Fail-safe iterators:"
    },
    {
        "type": "theory",
        "content": "Allow for concurrent modification of the collection during iteration.\nProvide a consistent view of the collection at the time the iterator was created.\nUseful in scenarios where you need to iterate over a collection while allowing modifications by other threads."
    },

        "type": "question",
        "content": "32. What is the purpose of the volatile keyword in Java? How does it relate to the happens-before relationship?"
    },
    {
        "type": "theory",
        "content": "The volatile keyword in Java ensures that changes to a variable are always immediately visible to other threads. It establishes a happens-before relationship, meaning that any write to a volatile variable is guaranteed to be visible to any subsequent read of the same variable by any thread."
    },
    {
        "type": "theory",
        "content": "Here\u2019s a concrete example:"
    },
    {
        "type": "code",
        "lang": "java",
        "content": "public class FlagExample {\n   private volatile boolean flag = false;\n   public void setFlag() {\n       flag = true;\n   }\n   public void checkFlag() {\n       while (!flag) {\n           // Wait for flag to be set\n       }\n       System.out.println(\"Flag was set!\");\n   }\n}Powered By"
    },
    {
        "type": "theory",
        "content": "So, without volatile, the checkFlag method might never see the update made by setFlag due to CPU caching or compiler optimizations, potentially resulting in an infinite loop. But with volatile, Java guarantees that:"
    },
    {
        "type": "theory",
        "content": "The write to flag in setFlag is immediately visible to all threads.\n\n\nThe read of flag in checkFlag always gets the most up-to-date value."
    },

    {

    {
        "type": "code",

        "type": "question",
        "content": "46. Explain the concept of lock-free programming in Java. What are its advantages and challenges?"
    },
    {
        "type": "theory",
        "content": "Lock-free programming, as the name suggests, is used to achieve thread-safety in multi-threaded environments without using locks. This is done by leveraging atomic operations and compare-and-swap (CAS) mechanisms."
    },
    {
        "type": "theory",
        "content": "This programming paradigm offers better scalability, no deadlocks and often better performance. Here is a quick example:"
    },
    {
        "type": "code",
        "lang": "java",
        "content": "AtomicInteger counter = new AtomicInteger(0);\ncounter.incrementAndGet(); // Thread-safe, lock-free incrementPowered By"
    },
    {
        "type": "theory",
        "content": "However, it comes with the following challenges:"
    },
    {
        "type": "theory",
        "content": "More complex implementation\nPotential for ABA problems (where a value changes from A to B and back to A, fooling compare-and-swap operations)\nCan increase memory usage"

        document.addEventListener('DOMContentLoaded', () => {
            const track = document.getElementById('content-track');
            let currentContainer = null;

            interviewData.forEach(item => {
                if (item.type === 'category') {
                    const catEl = document.createElement('div');
                    catEl.className = 'category-header';
                    catEl.textContent = item.content;
                    track.appendChild(catEl);
                    currentContainer = null;
                    return;
                }

                if (item.type === 'question') {
                    currentContainer = document.createElement('div');
                    currentContainer.className = 'qa-container';
                    track.appendChild(currentContainer);

                    const qEl = document.createElement('h2');
                    qEl.className = 'question';
                    qEl.textContent = item.content;
                    currentContainer.appendChild(qEl);
                    return;
                }

                if (!currentContainer) {
                    currentContainer = document.createElement('div');
                    currentContainer.className = 'qa-container';
                    track.appendChild(currentContainer);
                }

                if (item.type === 'theory') {
                    const hookRegex = /\*\*(.*?)\*\*/g;
                    let theoryHTML = item.content;
                    let match;
                    const hooks = [];

                    while ((match = hookRegex.exec(item.content)) !== null) {
                        hooks.push(match[1]);
                    }

                    theoryHTML = theoryHTML.replace(/(?<!<[^>]*?)`([^`]+)`(?![^<]*?>)/g, '<code>$1</code>');
                    theoryHTML = theoryHTML.replace(hookRegex, '<strong>$1</strong>');

                    const tEl = document.createElement('div');
                    tEl.className = 'theory';

                    let lines = theoryHTML.split('\n');
                    let inTable = false;
                    let tableHTML = '';
                    let finalLines = [];

                    for (let i = 0; i < lines.length; i++) {
                        let line = lines[i].trim();
                        if (line.startsWith('|') && line.endsWith('|')) {
                            if (!inTable) {
                                inTable = true;
                                tableHTML = '<div class="table-responsive"><table>\n';
                            }
                            
                            if (line.includes('---')) continue;
                            
                            let cells = line.split('|').slice(1, -1).map(c => c.trim());
                            let rowHTML = '<tr>';
                            cells.forEach(cell => {
                                if (tableHTML.indexOf('<tr>') === -1) {
                                    rowHTML += `<th>${cell}</th>`;
                                } else {
                                    rowHTML += `<td>${cell}</td>`;
                                }
                            });
                            rowHTML += '</tr>\n';
                            tableHTML += rowHTML;
                        } else {
                            if (inTable) {
                                inTable = false;
                                tableHTML += '</table></div>';
                                finalLines.push(tableHTML);
                            }
                            finalLines.push(lines[i]);
                        }
                    }
                    if (inTable) {
                        tableHTML += '</table></div>';
                        finalLines.push(tableHTML);
                    }

                    let formattedHTML = finalLines.join('<br>');
                    formattedHTML = formattedHTML.replace(/<br>- /g, '<br>• ');
                    formattedHTML = formattedHTML.replace(/<br><div class="table-responsive">/g, '<div class="table-responsive">');
                    formattedHTML = formattedHTML.replace(/<\/div><br>/g, '</div>');

                    tEl.innerHTML = formattedHTML;
                    currentContainer.appendChild(tEl);

                    hooks.forEach(hookText => {
                        const anchorEl = document.createElement('aside');
                        anchorEl.className = 'recall-anchor';
                        anchorEl.textContent = hookText;
                        currentContainer.appendChild(anchorEl);
                    });
                }

                if (item.type === 'code') {
                    const codeBlock = document.createElement('div');
                    codeBlock.className = 'code-container';
                    
                    const pre = document.createElement('pre');
                    const code = document.createElement('code');
                    const lang = item.lang ? item.lang : 'java';
                    code.className = `language-${lang}`;
                    code.textContent = item.content;
                    
                    pre.appendChild(code);
                    codeBlock.appendChild(pre);
                    currentContainer.appendChild(codeBlock);

                    if (lang === 'java') {
                        const runBtn = document.createElement('button');
                        runBtn.className = 'run-btn';
                        runBtn.innerHTML = '▶ Run Code';
                        
                        const consoleOut = document.createElement('div');
                        consoleOut.className = 'console-output';
                        
                        runBtn.onclick = () => executeJava(item.content, runBtn, consoleOut);
                        
                        currentContainer.appendChild(runBtn);
                        currentContainer.appendChild(consoleOut);
                    }
                }
            });

            if (window.Prism) {
                Prism.highlightAll();
            }
        });

        async function executeJava(sourceCode, btn, consoleOut) {
            btn.disabled = true;
            btn.innerHTML = '⏳ Running...';
            consoleOut.style.display = 'block';
            consoleOut.className = 'console-output';
            consoleOut.textContent = 'Compiling and executing on cloud...';

            let codeToRun = sourceCode;
            if (!codeToRun.includes('public class') && !codeToRun.includes('static void main')) {
                codeToRun = `import java.util.*;
import java.util.stream.*;
import java.util.concurrent.*;
public class Main {
    public static void main(String[] args) throws Exception {
        ${sourceCode}
    }
}`;
            } else if (!codeToRun.includes('public class') && codeToRun.includes('class ')) {
                codeToRun = codeToRun.replace('class ', 'public class ');
            }

            try {
                const response = await fetch('http://localhost:8080/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeToRun })
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    consoleOut.textContent = result.output || "Program finished with no output.";
                } else {
                    consoleOut.className = 'console-output error';
                    if (result.type === 'compile') {
                        consoleOut.textContent = "COMPILATION ERROR:\n" + result.output;
                    } else if (result.type === 'run') {
                        consoleOut.textContent = "RUNTIME ERROR:\n" + result.output;
                    } else {
                        consoleOut.textContent = "SERVER ERROR:\n" + result.output;
                    }
                }
            } catch (err) {
                consoleOut.className = 'console-output error';
                consoleOut.textContent = "Network error: Make sure you are running 'python compiler_server.py' in the background!\nDetails: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '▶ Run Code';
            }
        }
    </script>
